<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Engine</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="container">
<header>
  <div>
    <p class="eyebrow">PERSONAL KNOWLEDGE ENGINE</p>
    <h1>AI Engine</h1>
    <p class="sub">Save what you learn. Connect it. Build something from it.</p>
  </div>
  <span id="status" class="status">● Ready</span>
</header>

<section class="grid">
<div class="card">
  <h2>Save knowledge</h2>
  <input id="title" placeholder="Title, e.g. AI agents for SMBs">
  <input id="source" placeholder="Source URL (optional)">
  <textarea id="content" placeholder="Paste useful information here..."></textarea>
  <button onclick="saveKnowledge()">Save information</button>
</div>

<div class="card">
  <h2>Ask your knowledge</h2>
  <textarea id="query" placeholder="e.g. Generate a low-cost startup idea from my saved knowledge"></textarea>
  <button onclick="generateIdea()">Generate idea</button>
  <div id="result" class="result muted">Your generated idea will appear here.</div>
</div>
</section>

<section class="card">
<div class="row"><h2>Knowledge base</h2><button class="secondary" onclick="loadKnowledge()">Refresh</button></div>
<div id="knowledge"></div>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
